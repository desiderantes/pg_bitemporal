name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: PostgreSQL ${{ matrix.pg_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg_version: ['14', '15', '16', '17', '18']

    env:
      CI: "true"
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: ubuntu
      PGPASSWORD: f0285cb79f623675a3df3fe88a014d80a7276e55
      PGDATABASE: ci_test
      POSTGRES_VERSION: ${{ matrix.pg_version }}

    services:
      postgres:
        image: postgres:${{ matrix.pg_version }}
        env:
          POSTGRES_USER: ${{ env.PGUSER }}
          POSTGRES_PASSWORD: ${{ env.PGPASSWORD }}
          POSTGRES_DB: ${{ env.PGDATABASE }}
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure PostgreSQL credentials
        run: |
          echo "*:*:*:${PGUSER}:${PGPASSWORD}" > ~/.pgpass
          chmod 600 ~/.pgpass

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client meson ninja-build doxygen python3-sqlparse python3-sphinx python3-breathe python3-myst-parser furo

      - name: Setup Meson
        run: |
          meson setup build \
            -Dpghost="$PGHOST" \
            -Dpgport="$PGPORT" \
            -Dpguser="$PGUSER" \
            -Dpgdatabase="$PGDATABASE" \
            -Dpgversion="$POSTGRES_VERSION"

      - name: Load Database via Meson
        run: |
          meson compile -C build load
          meson compile -C build load_pgtap

      - name: Run Tests via Meson
        run: |
          meson test -C build --verbose
